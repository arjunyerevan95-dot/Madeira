name: Finish initial Madeira build
on:
  workflow_run:
    workflows: [Build iOS dependencies]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  app:
    # This initial run also contains a superseded FEX attempt. The successful
    # FEX and Wine archives come from their later, explicitly selected runs.
    if: github.event.workflow_run.id == 34186792949
    uses: ./.github/workflows/ios-app.yml
    with:
      fex_run: '34187249483'
      llvm_run: '34186792949'
      wine_run: '34186930997'
