name: Build iOS dependencies
on:
  workflow_dispatch:
    inputs:
      component:
        description: Dependency to build
        type: choice
        options: [all, fex, llvm, wine]
        default: all
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.component }} for iPhone
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.component == 'all' && '["fex","llvm","wine"]' || format('["{0}"]', inputs.component)) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install cmake ninja
          if [ '${{ matrix.component }}' = wine ]; then
            brew install bison llvm gnutls pkg-config
          fi
      - name: Build dependency
        run: |
          mkdir -p ci-output
          set -o pipefail
          bash scripts/ci-build-dependency.sh '${{ matrix.component }}' 2>&1 | tee 'ci-output/${{ matrix.component }}.log'
      - name: Preserve build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.component }}
          path: |
            ci-output/
            build/gnutls-ios/obj/*.log
            build/ntdll-unix/obj/*.err
            build/win32u-unix/obj/*.err
            build/wineserver/obj/err-*.txt
            wine/build-macos/config.log
          if-no-files-found: error
          retention-days: 14
